# golangci-lint v2 config for agent-assisted development.
# Prefer catching bugs, unsafe patterns, and inconsistency over style nits.
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - canonicalheader
    - contextcheck
    - copyloopvar
    - depguard
    - durationcheck
    - errorlint
    - exhaustruct_v5
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - gocritic
    - gosec
    - intrange
    - loggercheck
    - makezero
    - misspell
    - modernize
    - nakedret
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - predeclared
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - testifylint
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace

  settings:
    depguard:
      # Clean-architecture import direction (inward only).
      # Allowed edges: controllers→usecases→domain, controllers→views,
      # repositories→domain|usecases, apps→controllers|usecases|repositories.
      rules:
        domain:
          files:
            - "**/internal/domain/*.go"
          deny:
            - pkg: github.com/fjnkt98/tasks/internal/usecases
              desc: domain must not depend on usecases
            - pkg: github.com/fjnkt98/tasks/internal/repositories
              desc: domain must not depend on repositories
            - pkg: github.com/fjnkt98/tasks/internal/controllers
              desc: domain must not depend on controllers
            - pkg: github.com/fjnkt98/tasks/internal/views
              desc: domain must not depend on views
            - pkg: github.com/fjnkt98/tasks/internal/apps
              desc: domain must not depend on apps
            - pkg: github.com/fjnkt98/tasks/internal/schema
              desc: domain must not depend on schema
            - pkg: github.com/fjnkt98/tasks/internal/testutils
              desc: domain must not depend on testutils
        views:
          files:
            - "**/internal/views/*.go"
          deny:
            - pkg: github.com/fjnkt98/tasks/internal/domain
              desc: views must not depend on domain
            - pkg: github.com/fjnkt98/tasks/internal/usecases
              desc: views must not depend on usecases
            - pkg: github.com/fjnkt98/tasks/internal/repositories
              desc: views must not depend on repositories
            - pkg: github.com/fjnkt98/tasks/internal/controllers
              desc: views must not depend on controllers
            - pkg: github.com/fjnkt98/tasks/internal/apps
              desc: views must not depend on apps
            - pkg: github.com/fjnkt98/tasks/internal/schema
              desc: views must not depend on schema
            - pkg: github.com/fjnkt98/tasks/internal/testutils
              desc: views must not depend on testutils
        schema:
          files:
            - "**/internal/schema/*.go"
          deny:
            - pkg: github.com/fjnkt98/tasks/internal/domain
              desc: schema must not depend on domain
            - pkg: github.com/fjnkt98/tasks/internal/usecases
              desc: schema must not depend on usecases
            - pkg: github.com/fjnkt98/tasks/internal/repositories
              desc: schema must not depend on repositories
            - pkg: github.com/fjnkt98/tasks/internal/controllers
              desc: schema must not depend on controllers
            - pkg: github.com/fjnkt98/tasks/internal/views
              desc: schema must not depend on views
            - pkg: github.com/fjnkt98/tasks/internal/apps
              desc: schema must not depend on apps
            - pkg: github.com/fjnkt98/tasks/internal/testutils
              desc: schema must not depend on testutils
        usecases:
          files:
            - "**/internal/usecases/*.go"
          deny:
            - pkg: github.com/fjnkt98/tasks/internal/repositories
              desc: usecases must not depend on repositories (ports live in usecases)
            - pkg: github.com/fjnkt98/tasks/internal/controllers
              desc: usecases must not depend on controllers
            - pkg: github.com/fjnkt98/tasks/internal/views
              desc: usecases must not depend on views
            - pkg: github.com/fjnkt98/tasks/internal/apps
              desc: usecases must not depend on apps
            - pkg: github.com/fjnkt98/tasks/internal/schema
              desc: usecases must not depend on schema
            - pkg: github.com/fjnkt98/tasks/internal/testutils
              desc: usecases must not depend on testutils
        repositories:
          files:
            - "**/internal/repositories/*.go"
          deny:
            - pkg: github.com/fjnkt98/tasks/internal/controllers
              desc: repositories must not depend on controllers
            - pkg: github.com/fjnkt98/tasks/internal/views
              desc: repositories must not depend on views
            - pkg: github.com/fjnkt98/tasks/internal/apps
              desc: repositories must not depend on apps
            - pkg: github.com/fjnkt98/tasks/internal/schema
              desc: repositories must not depend on schema
            - pkg: github.com/fjnkt98/tasks/internal/testutils
              desc: repositories must not depend on testutils
        controllers:
          files:
            - "**/internal/controllers/*.go"
          deny:
            - pkg: github.com/fjnkt98/tasks/internal/repositories
              desc: controllers must not depend on repositories
            - pkg: github.com/fjnkt98/tasks/internal/apps
              desc: controllers must not depend on apps
            - pkg: github.com/fjnkt98/tasks/internal/schema
              desc: controllers must not depend on schema
            - pkg: github.com/fjnkt98/tasks/internal/testutils
              desc: controllers must not depend on testutils
        apps:
          files:
            - "**/internal/apps/*.go"
          deny:
            - pkg: github.com/fjnkt98/tasks/internal/views
              desc: apps wires controllers; leave views to controllers
            - pkg: github.com/fjnkt98/tasks/internal/schema
              desc: apps must not depend on schema
            - pkg: github.com/fjnkt98/tasks/internal/testutils
              desc: apps must not depend on testutils
        testutils:
          files:
            - "**/internal/testutils/*.go"
          deny:
            - pkg: github.com/fjnkt98/tasks/internal/usecases
              desc: testutils must not depend on usecases
            - pkg: github.com/fjnkt98/tasks/internal/repositories
              desc: testutils must not depend on repositories
            - pkg: github.com/fjnkt98/tasks/internal/controllers
              desc: testutils must not depend on controllers
            - pkg: github.com/fjnkt98/tasks/internal/views
              desc: testutils must not depend on views
            - pkg: github.com/fjnkt98/tasks/internal/apps
              desc: testutils must not depend on apps
            - pkg: github.com/fjnkt98/tasks/internal/domain
              desc: testutils must not depend on domain
    errcheck:
      check-type-assertions: true
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    exhaustruct_v5:
      # Opt-in for this module's types only (stdlib/third-party stay unchecked).
      explicit-mode: true
      enforce-patterns:
        - 'github\.com/fjnkt98/tasks(\..*|/.+)'
      allow-empty-declarations: true
      allow-empty-blank-assignments: true
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^(fmt\.Print(|f|ln)|print|println)$
        - pattern: ^http\.(DefaultClient|DefaultTransport)$
          msg: Do not use the shared http.DefaultClient/DefaultTransport; create a client with timeouts.
    nonamedreturns:
      report-error-in-defer: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - hugeParam
        - rangeValCopy
    gosec:
      excludes:
        # Secure flag is intentionally env-gated for local HTTP (USE_SECURE_COOKIE).
        - G124
    govet:
      enable:
        - nilness
      disable:
        # Idiomatic `if err :=` shadows are common and rarely useful for agents.
        - shadow
    misspell:
      locale: US
    modernize:
      disable:
        # Keep explicit embedded field names for readability in this codebase.
        - embedlit
    nilnil:
      checked-types:
        - ptr
        - iface
        - map
        - chan
        - func
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-declaration
        - name: package-comments
          disabled: true
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
          disabled: true
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: exported
          disabled: true
        - name: var-naming
    sloglint:
      no-global: ""
      context: scope
    testifylint:
      enable-all: true
      disable:
        - float-compare
        - go-require

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Helpers that close the body are not always visible to bodyclose.
      - path: _test\.go
        linters:
          - bodyclose
          - gosec
          - noctx
      - path: internal/testutils/
        linters:
          - gosec
      # Side-effect imports for drivers / embeds.
      - path: internal/repositories/database\.go
        text: "blank-imports"
        linters:
          - revive
      - path: internal/testutils/database\.go
        text: "blank-imports"
        linters:
          - revive
      # Shutdown helpers intentionally use a fresh timeout context.
      - path: cmd/tasks/main\.go
        text: "Non-inherited new context|Function `setup\\$1`"
        linters:
          - contextcheck
      - path: internal/controllers/middleware\.go
        text: "Function `NewRecoveryMiddleware"
        linters:
          - contextcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
      rewrite-rules:
        - pattern: "interface{}"
          replacement: "any"
    goimports:
      local-prefixes:
        - github.com/fjnkt98/tasks
