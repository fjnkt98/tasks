{{ template "base" . }} {{ define "content" }}
<div class="container mx-auto py-4 px-8">
  <div class="breadcrumbs text-sm">
    <ul>
      <li><a class="link" href="/">Top</a></li>
      <li>Tasks</li>
    </ul>
  </div>

  <a class="btn btn-primary" href="/tasks/new">New</a>

  <ul id="tasks" class="list bg-base-100 rounded-box shadow-md">
    {{ range $task := .Tasks }}
    <li id="task-{{ $task.ID }}" class="list-row items-center">
      <a id="task-{{ $task.ID }}-title" class="text-lg link link-hover" href="/tasks/{{ $task.ID }}/edit">
        {{ $task.Title }}
      </a>
      <div
        id="task-{{ $task.ID }}-description"
        class="list-col-grow text-xs text-wrap opacity-60"
      >
        {{ $task.Description }}
      </div>
      <input
        id="task-{{ $task.ID }}-status"
        type="checkbox"
        class="checkbox"
        hx-put="/api/tasks/{{ $task.ID }}/status"
        hx-swap="none"
        hx-vals="js:{status: this.checked ? 'done' : 'created'}"
        {{ if eq $task.Status "done" }}checked{{ end }}
      />
      <button
          id="task-{{ $task.ID }}-delete"
          type="button"
          class="btn btn-outline btn-square btn-error btn-xs"
          hx-delete="/api/tasks/{{ $task.ID }}"
          hx-target="#task-{{ $task.ID }}"
          hx-confirm="Sure?"
          hx-swap="outerHTML"
      >X</button>
    </li>
    {{ end }}
  </ul>
</div>
{{ end }}
