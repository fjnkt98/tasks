{{ template "base" . }} {{ define "content" }}
<div class="container mx-auto py-4 px-8">
  <div class="breadcrumbs text-sm">
    <ul>
      <li><a class="link" href="/">Top</a></li>
      <li><a class="link" href="/tasks">Tasks</a></li>
      <li>New Task</li>
    </ul>
  </div>

  <form action="/tasks" method="post" class="card w-2/3">
    <div class="card-body">
      <fieldset class="fieldset">
        <label class="label" for="title">Title</label>
        <input
          type="text"
          name="title"
          id="title"
          class="input validator"
          required
        />
        <div class="validator-hint">Title required.</div>

        <label class="label" for="description">Description</label>
        <input type="text" name="description" id="description" class="input" />
      </fieldset>
      <div class="card-actions justify-end">
        <button type="submit" class="btn btn-primary">Submit</button>
      </div>
    </div>
  </form>
</div>
{{ end }}
