name: sqldef
run-name: sqldef
on:
  pull_request:
    paths:
      - internal/schema/schema.sql
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: preview-sqldef
        uses: sqldef/sqldef-preview-action@c02e888491ec4560b9ade14df5fe5b7a40df44dc # v1
        with:
          command: sqlite3def
          version: v3.11.26
          schema-file: internal/schema/schema.sql
          sqlite-database: test.db
          github-token: ${{ env.GITHUB_TOKEN }}
