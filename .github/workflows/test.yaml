name: test
run-name: test
on:
  push:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "admin"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.8.0
          install: true
          cache: true

      - name: lint
        run: mise run 'lint:*'

      - name: vuln
        run: mise run vuln

      - name: test
        run: mise run test

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "admin"
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.8.0
          install: true
          cache: true

      - name: build
        run: |
          mise run image:build:app "$GITHUB_SHA"
          mise run image:build:otelcol "$GITHUB_SHA"

      - name: authenticate
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: tasks-510111
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.IMAGE_PUBLISHER_SERVICE_ACCOUNT }}

      - name: setup gcloud
        uses: 'google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db' # v3.0.1
        with:
          project_id: tasks-510111

      - name: configure docker auth
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: push images
        run: |
          mise run image:push:app "$GITHUB_SHA"
          mise run image:push:otelcol "$GITHUB_SHA"
