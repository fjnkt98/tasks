receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:

exporters:
  googlecloud:

service:
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - googlecloud
    logs:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - googlecloud
