{{ define "page/user" }} {{ template "header" . }}
<div class="flex-grow">
  <div class="container mx-auto py-4 px-8">
    <div class="breadcrumbs text-sm">
      <ul>
        <li><a class="link" href="/">Top</a></li>
        <li><a class="link" href="/users">Users</a></li>
        <li>{{ .UserName }}</li>
      </ul>
    </div>

    <div class="flex min-w-0 w-full flex-col max-w-md mx-auto">
      <h1 class="text-2xl font-bold text-primary my-2">{{ .UserName }}</h1>

      <div class="stats shadow my-4">
        <div class="stat place-items-center">
          <div class="stat-title">Tasks</div>
          <div class="stat-value">{{ .TaskCount }}</div>
        </div>

        <div class="stat place-items-center">
          <div class="stat-title">Done</div>
          <div class="stat-value text-secondary">{{ .DoneCount }}</div>
        </div>
      </div>

      <div class="my-6 px-4 py-2 rounded-box shadow">
        <h2 class="text-gray-400 font-medium">Activity</h2>
        {{ template "partials/activities" . }}
      </div>
    </div>
  </div>
</div>
{{ template "footer" . }} {{ end }}
