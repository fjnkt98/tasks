{{ define "page/users" }} {{ template "header" . }}
<div class="flex-grow">
  <div class="container mx-auto py-4 px-8">
    <div class="breadcrumbs text-sm">
      <ul>
        <li><a class="link" href="/">Top</a></li>
        <li>Users</li>
      </ul>
    </div>

    <div>
      <div class="join grid grid-cols-2">
        {{ if .HasPrev }}
        <a href="/users?page={{ .Prev }}" class="join-item btn btn-primary"
          >Prev</a
        >
        {{ else }}
        <span class="join-item btn btn-disabled">Prev</span>
        {{ end }} {{ if .HasNext }}
        <a href="/users?page={{ .Next }}" class="join-item btn btn-primary"
          >Next</a
        >
        {{ else }}
        <span class="join-item btn btn-disabled">Next</span>
        {{ end }}
      </div>
    </div>

    <ul id="users" class="list rounded-box shadow-md">
      {{ template "partial/users" .}}
    </ul>
  </div>
</div>
{{ template "footer" . }} {{ end }}
