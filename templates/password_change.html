{{ define "content" }}
<div class="hero">
  <div class="hero-content flex-col">
    <div class="text-center">
      <h1 class="text-4xl font-bold">Password Change</h1>
    </div>

    {{ if .ErrorMessage }}
    <div role="alert" class="alert alert-error w-full max-w-sm">
      <span>{{ .ErrorMessage }}</span>
    </div>
    {{ end }}

    <div class="card w-full max-w-sm shrink-0 shadow-lg">
      <div class="card-body">
        <form method="post" action="/account/password_change">
          <fieldset class="fieldset">
            <label class="label">Current Password</label>
            <input
              type="password"
              class="input"
              name="current-password"
              placeholder="Password"
              autocomplete="current-password"
              required
            />

            <label class="label">New Password</label>
            <input
              type="password"
              class="input"
              name="new-password"
              placeholder="New Password"
              autocomplete="new-password"
              required
            />

            <label class="label">Confirm New Password</label>
            <input
              type="password"
              class="input"
              name="confirm-new-password"
              placeholder="Confirm New Password"
              autocomplete="new-password"
              required
            />

            <button type="submit" class="btn btn-neutral mt-4">Submit</button>
          </fieldset>
        </form>
      </div>
    </div>
  </div>
</div>
{{ end }}
