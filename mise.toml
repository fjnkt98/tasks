[tools]
actionlint = "1.7.12"
go = "1.27.1"
golangci-lint = "2.14.0"
node = "24"
pinact = "4.1.0"
sqlite = "3.53.4"
sqlite3def = "3.11.26"
terraform = "1.16.4"
tflint = "latest"

[env]
CGO_ENABLED = 1
DATABASE_URL = { default = "file:app.db", redact = true }
GOOGLE_CLOUD_PROJECT_NAME = { default = "tasks" }
OTEL_COLLECTOR_URL = { default = "localhost:4317" }
PORT = { default = 8000 }
USE_SECURE_COOKIE = { default = "false" }

[tasks."db:migrate"]
run = ["sqlite3def --file=schema.sql app.db --apply --enable-drop"]

[tasks."db:check"]
run = ["sqlite3def --file=schema.sql app.db --check --enable-drop"]

[tasks."fmt:go"]
run = ["go fmt"]

[tasks."fmt:terraform"]
dir = "infrastructure/terraform"
run = ["terraform fmt"]

[tasks."lint:go"]
run = ["go mod tidy -diff", "golangci-lint run"]

[tasks."lint:action"]
run = ["actionlint", "pinact run --check"]

[tasks."lint:terraform"]
dir = "infrastructure/terraform"
run = ["terraform fmt -check", "tflint"]

[tasks.test]
run = [
    "go test -cover ./... -coverprofile=cover.out",
    "go tool cover -html=cover.out -o cover.html",
]

[tasks."image:build:app"]
usage = """
arg "version" default="latest"
"""
run = [
    "docker build --platform=linux/amd64 --tag asia-northeast1-docker.pkg.dev/tasks-510111/tasks/app:${usage_version?} -f infrastructure/app/Dockerfile ."
]

[tasks."image:push:app"]
usage = """
arg "version" default="latest"
"""
run = [
    "docker push asia-northeast1-docker.pkg.dev/tasks-510111/tasks/app:${usage_version?}"
]

[tasks."image:build:otelcol"]
usage = """
arg "version" default="latest"
"""
run = [
    "docker build --platform=linux/amd64 --tag asia-northeast1-docker.pkg.dev/tasks-510111/tasks/otelcol:${usage_version?} -f infrastructure/otelcol/Dockerfile ."
]

[tasks."image:push:otelcol"]
usage = """
arg "version" default="latest"
"""
run = [
    "docker push asia-northeast1-docker.pkg.dev/tasks-510111/tasks/otelcol:${usage_version?}"
]
